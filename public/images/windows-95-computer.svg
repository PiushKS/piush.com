<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' width='32' height='32' shape-rendering='crispEdges'>
  <!-- Windows 95 32x32 Desktop PC Icon -->
  <!-- Monitor Outer Beige Casing -->
  <rect x='3' y='2' width='22' height='17' fill='#c0c0c0' stroke='#000000' stroke-width='1'/>
  <rect x='4' y='3' width='20' height='1' fill='#ffffff'/>
  <rect x='4' y='3' width='1' height='15' fill='#ffffff'/>
  <rect x='24' y='3' width='1' height='15' fill='#808080'/>
  <rect x='4' y='18' width='21' height='1' fill='#808080'/>

  <!-- Screen Bezel (Sunken) -->
  <rect x='6' y='5' width='16' height='11' fill='#808080'/>
  <rect x='7' y='6' width='14' height='9' fill='#000080'/>
  <rect x='6' y='5' width='15' height='1' fill='#000000'/>
  <rect x='6' y='5' width='1' height='10' fill='#000000'/>
  <rect x='21' y='6' width='1' height='10' fill='#ffffff'/>
  <rect x='7' y='15' width='15' height='1' fill='#ffffff'/>

  <!-- CRT Screen Glare and Prompt -->
  <rect x='8' y='7' width='3' height='1' fill='#5555ff'/>
  <rect x='9' y='9' width='3' height='2' fill='#00ff00'/>
  <rect x='13' y='10' width='4' height='1' fill='#ffffff'/>

  <!-- Monitor Stand -->
  <rect x='11' y='19' width='6' height='2' fill='#c0c0c0' stroke='#000000' stroke-width='1'/>
  <rect x='8' y='21' width='12' height='1' fill='#808080'/>

  <!-- Desktop PC Tower Case Underneath -->
  <rect x='2' y='22' width='28' height='7' fill='#c0c0c0' stroke='#000000' stroke-width='1'/>
  <rect x='3' y='23' width='26' height='1' fill='#ffffff'/>
  <rect x='3' y='23' width='1' height='5' fill='#ffffff'/>
  <rect x='29' y='23' width='1' height='5' fill='#808080'/>
  <rect x='3' y='28' width='27' height='1' fill='#808080'/>

  <!-- 3.5" Floppy Disk Drive Slot -->
  <rect x='17' y='24' width='10' height='2' fill='#000000'/>
  <rect x='18' y='24' width='8' height='1' fill='#808080'/>
  <rect x='25' y='27' width='2' height='1' fill='#00ff00'/> <!-- Floppy Activity LED -->

  <!-- Power Button & LED -->
  <rect x='5' y='25' width='2' height='2' fill='#808080'/>
  <rect x='8' y='25' width='2' height='2' fill='#00ff00'/> <!-- Power Green LED -->
</svg>