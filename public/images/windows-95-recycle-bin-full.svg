<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' width='32' height='32' shape-rendering='crispEdges'>
  <!-- Crumpled paper and documents overflowing from top -->
  <polygon points='10,4 15,2 17,5 12,7' fill='#ffffff' stroke='#000000' stroke-width='1'/>
  <rect x='18' y='3' width='6' height='5' fill='#ffffff' stroke='#000000' stroke-width='1'/>
  <line x1='19' y1='5' x2='22' y2='5' stroke='#000080' stroke-width='1'/>
  <polygon points='13,3 17,2 19,5 15,6' fill='#d8d8d8'/>
  <rect x='14' y='4' width='4' height='3' fill='#ffffff'/>
  
  <!-- Bin Top Rim -->
  <rect x='7' y='6' width='18' height='3' fill='#c0c0c0' stroke='#000000' stroke-width='1'/>
  <rect x='8' y='7' width='16' height='1' fill='#ffffff'/>
  
  <!-- Paper inside the basket visible through mesh -->
  <polygon points='8,9 10,27 22,27 24,9' fill='#e8e8e8' stroke='#000000' stroke-width='1'/>
  <rect x='10' y='10' width='12' height='10' fill='#ffffff'/>
  <line x1='12' y1='12' x2='20' y2='12' stroke='#808080' stroke-width='1'/>
  <line x1='12' y1='15' x2='18' y2='15' stroke='#808080' stroke-width='1'/>
  <line x1='12' y1='18' x2='19' y2='18' stroke='#808080' stroke-width='1'/>
  
  <!-- Bin Slats -->
  <rect x='11' y='11' width='2' height='14' fill='#808080'/>
  <rect x='15' y='11' width='2' height='14' fill='#808080'/>
  <rect x='19' y='11' width='2' height='14' fill='#808080'/>
  
  <!-- Recycling Green Mobius Ribbon Symbol -->
  <rect x='13' y='15' width='6' height='2' fill='#00aa00'/>
  <rect x='12' y='17' width='2' height='3' fill='#00aa00'/>
  <rect x='18' y='17' width='2' height='3' fill='#00aa00'/>
  <rect x='14' y='19' width='4' height='2' fill='#00aa00'/>
  <rect x='11' y='18' width='2' height='2' fill='#00ff00'/>
  <rect x='19' y='16' width='2' height='2' fill='#00ff00'/>
</svg>
