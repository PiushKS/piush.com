<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Windows 95 The Microsoft Network Icon -->
  <!-- Globe Base -->
  <circle cx="16" cy="16" r="11" fill="#205081" stroke="#000000" stroke-width="1" />
  <!-- Grid lines -->
  <ellipse cx="16" cy="16" rx="6" ry="11" fill="none" stroke="#60a0e0" stroke-width="1" />
  <line x1="5" y1="16" x2="27" y2="16" stroke="#60a0e0" stroke-width="1" />
  <line x1="7" y1="11" x2="25" y2="11" stroke="#60a0e0" stroke-width="1" />
  <line x1="7" y1="21" x2="25" y2="21" stroke="#60a0e0" stroke-width="1" />
  <!-- Antenna & Signal Rings -->
  <path d="M16 5v6" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="16" cy="5" r="1.5" fill="#ff0000" />
  <!-- Satellite Orbit ring -->
  <ellipse cx="16" cy="16" rx="14" ry="4" fill="none" stroke="#ffffff" stroke-width="1" transform="rotate(-30 16 16)" />
</svg>
