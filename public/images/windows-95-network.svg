<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' width='32' height='32' shape-rendering='crispEdges'>
  <!-- Top Left PC -->
  <rect x='4' y='4' width='14' height='10' fill='#c0c0c0' stroke='#000000' stroke-width='1'/>
  <rect x='6' y='6' width='10' height='6' fill='#000080'/>
  <rect x='4' y='14' width='14' height='3' fill='#808080' stroke='#000000' stroke-width='1'/>

  <!-- Bottom Right PC -->
  <rect x='14' y='14' width='14' height='10' fill='#c0c0c0' stroke='#000000' stroke-width='1'/>
  <rect x='16' y='16' width='10' height='6' fill='#000080'/>
  <rect x='14' y='24' width='14' height='3' fill='#808080' stroke='#000000' stroke-width='1'/>

  <!-- Network Cable Bus Connecting Both -->
