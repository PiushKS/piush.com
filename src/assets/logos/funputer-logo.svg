<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <defs>
    <linearGradient id="funputer-brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
  </defs>
  <!-- Outer computer frame -->
  <rect x="8" y="20" width="80" height="64" rx="18" fill="url(#funputer-brand-grad)" />
  <!-- Inner terminal screen -->
  <rect x="14" y="26" width="68" height="52" rx="12" fill="#0F172A" />
  <!-- Terminal code prompt > -->
  <path d="M30 44 L38 52 L30 60" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Terminal cursor _ -->
  <line x1="46" y1="60" x2="56" y2="60" stroke="#FBBF24" stroke-width="4" stroke-linecap="round" />
  <!-- Playful wave arc -->
  <path d="M62 46 C66 50 66 55 62 59" stroke="#A78BFA" stroke-width="3.5" stroke-linecap="round" />
  <!-- Creative spark star -->
  <path d="M80 6 L82 13 L89 15 L82 17 L80 24 L78 17 L71 15 L78 13 Z" fill="#FBBF24" />
</svg>